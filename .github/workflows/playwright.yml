name: Playwright Test Suite

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  # ==================================================
  # API TESTS
  # ==================================================

  api-tests:

    name: API Tests

    timeout-minutes: 15

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # CHECKOUT
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # NODE.JS
      # ------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------

      - name: Install dependencies
        run: npm ci


      # ------------------------------------------
      # PLAYWRIGHT
      # ------------------------------------------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium


      # ------------------------------------------
      # API TESTS
      # ------------------------------------------

      - name: Run API tests
        run: npm run test:api
        env:
          API_BASE_URL: https://automationexercise.com/api
          BASE_URL: https://automationexercise.com

          EXISTING_TEST_EMAIL: ${{ secrets.USERNAME }}
          EXISTING_TEST_PASSWORD: ${{ secrets.PASSWORD }}

          SKIP_GLOBAL_SETUP: true


      # ------------------------------------------
      # API REPORT
      # ------------------------------------------

      - name: Upload API Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14


  # ==================================================
  # UI TESTS
  # ==================================================

  ui-tests:

    name: UI Tests

    timeout-minutes: 20

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # CHECKOUT
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # NODE.JS
      # ------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------

      - name: Install dependencies
        run: npm ci


      # ------------------------------------------
      # PLAYWRIGHT
      # ------------------------------------------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium


      # ------------------------------------------
      # VERIFY ENVIRONMENT
      # ------------------------------------------

      - name: Verify authentication configuration
        shell: bash
        run: |
          if [ -z "$EXISTING_TEST_EMAIL" ]; then
            echo "::error::EXISTING_TEST_EMAIL is not configured."
            exit 1
          fi

          if [ -z "$EXISTING_TEST_PASSWORD" ]; then
            echo "::error::EXISTING_TEST_PASSWORD is not configured."
            exit 1
          fi

          echo "Authentication credentials are configured."
        env:
          EXISTING_TEST_EMAIL: ${{ secrets.USERNAME }}
          EXISTING_TEST_PASSWORD: ${{ secrets.PASSWORD }}


      # ------------------------------------------
      # UI TESTS
      # ------------------------------------------

      - name: Run UI tests
        run: npm run test:ui
        env:
          BASE_URL: https://automationexercise.com

          EXISTING_TEST_EMAIL: ${{ secrets.USERNAME }}
          EXISTING_TEST_PASSWORD: ${{ secrets.PASSWORD }}


      # ------------------------------------------
      # UI REPORT
      # ------------------------------------------

      - name: Upload UI Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14


      # ------------------------------------------
      # AUTH DIAGNOSTICS
      # ------------------------------------------

      - name: Upload authentication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-diagnostics
          path: |
            auth-diagnostics/
            auth-failure-attempt-*.png
            auth-failure-attempt-*.html
            storageState.json
          if-no-files-found: ignore
          retention-days: 7